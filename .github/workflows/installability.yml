name: Installability

# Disabled this test for windows due to:
#
# FileTracker : error FTK1011: could not create the new file tracking log [C:\Users\runneradmin\.hunter\_Base\69e4a05\0e2d5bb\1dae5df\Build\outcome\Build\outcome-Release.vcxproj]
#    file:
#    C:\Users\runneradmin\.hunter\_Base\69e4a05\0e2d5bb\1dae5df\Build\outcome\Build\outcome-Release-prefix\src\outcome-Release-build\quickcpplib\repo\src\quickcpplib-build\CMakeFiles\CMakeScratch\TryCompile-0na0g7\cmTC_0898c.dir\Debug\cmTC_0898c.tlog\CL.read.1.tlog.
#
# ... which is 261 characters long. Basically it looks like github actions turned off long path support, and I couldn't be arsed jigging with this to work around that.

on:
  push:
    branches:
    - develop
    - master
  pull_request:
  schedule:
  - cron: '0 0 1 * *'

jobs:
  installability:
    name: "Installability"
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-latest is Ubuntu 26.04 now, which never had a Python 3.8 build, and this lane
        # exists to prove installability on the oldest Python we support. Pin an image which
        # setup-python still publishes 3.8 for (it does for 24.04) rather than raising the
        # Python floor.
        os: [ubuntu-24.04, macos-latest]  # windows-2022
        configuration: [error_code, status_code]
    env:
      NAME: Install-${{ matrix.os }}-${{ matrix.configuration }}
      # The library this lane installs is the ref under review: the head branch of a pull
      # request, cloned from the PR's own repository so a fork works, and otherwise the branch
      # that was pushed. Asking for 'develop' unconditionally meant a pull request re-tested
      # develop, so this lane could never be green for a change that fixes something develop
      # has not got yet - which is precisely what it is there to catch.
      LLFIO_REPO: ${{ github.event.pull_request.head.repo.clone_url || 'https://github.com/ned14/llfio' }}
      LLFIO_BRANCH: ${{ github.head_ref || github.ref_name }}
    runs-on: ${{ matrix.os }}
          
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: 3.8

    - name: Install
      shell: bash
      run: |
       git config --global core.longpaths true
       if [ "${{ matrix.os }}" = "ubuntu-18.04" ]; then
         sudo apt-get remove -y libssl-dev
         sudo apt-get autoremove
       fi
       if [ "${{ matrix.configuration }}" = "status_code" ]; then
         export CMAKE_CONFIGURE_OPTIONS="-DLLFIO_USE_EXPERIMENTAL_SG14_STATUS_CODE=ON"
       fi
       git clone --depth 1 https://github.com/ned14/quickcpplib.git
       pip install --user gitpython
       python quickcpplib/scripts/test_cpp-pm_install.py test-packaging/example.cpp quickcpplib quickcpplib::hl https://github.com/ned14/quickcpplib master "" outcome outcome::hl https://github.com/ned14/outcome master "" llfio llfio::sl "$LLFIO_REPO" "$LLFIO_BRANCH" "$CMAKE_CONFIGURE_OPTIONS"
       cd test_cpp-pm_install
       cat cmake/Hunter/config.cmake
       cat CMakeLists.txt
       mkdir build
       cd build
       cmake .. -DCMAKE_BUILD_TYPE=Release
       cmake --build .
